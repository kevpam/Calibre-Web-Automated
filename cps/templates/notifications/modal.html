{# Rendered into the existing Bootstrap modal-body. No wrapper modal markup. #}
<form onsubmit="event.preventDefault(); saveAgent();">
  <div class="form-group">
    <label for="{{ provider }}_name">{{ _('Display name') }}</label>
    <input id="{{ provider }}_name" name="{{ provider }}_name" type="text" class="form-control" placeholder="{{ _('Optional') }}">
  </div>

  <div class="form-group">
    <label for="{{ provider }}_webhook">{{ _('Webhook URL') }}</label>
    <input id="{{ provider }}_webhook" name="{{ provider }}_webhook" type="url" class="form-control" required>
    <p class="help-block">
      {{ _('Paste the %(prov)s webhook URL here.', prov=(provider|capitalize)) }}
    </p>
  </div>

  <div class="form-group">
    <label for="{{ provider }}_username">{{ _('Username (override)') }}</label>
    <input id="{{ provider }}_username" name="{{ provider }}_username" type="text" class="form-control">
  </div>

  <div class="form-group">
    <label for="{{ provider }}_avatar">{{ _('Avatar URL') }}</label>
    <input id="{{ provider }}_avatar" name="{{ provider }}_avatar" type="url" class="form-control" placeholder="https://...">
  </div>

  <div class="form-group">
    <label for="{{ provider }}_color">{{ _('Accent color (hex)') }}</label>
    <input id="{{ provider }}_color" name="{{ provider }}_color" type="text" class="form-control" placeholder="#5865F2">
  </div>

  <div class="checkbox">
    <label>
      <input type="checkbox" name="{{ provider }}_incl_subject" value="1">
      {{ _('Include subject/title') }}
    </label>
  </div>

  <div class="checkbox">
    <label>
      <input type="checkbox" name="{{ provider }}_tts" value="1">
      {{ _('Text-to-speech (if supported)') }}
    </label>
  </div>

  <hr>

  <div class="form-group">
    <label>{{ _('Enabled triggers') }}</label>
    <div>
      {% for t in notification_triggers %}
        <div class="checkbox">
          <label>
            <input type="checkbox" name="{{ provider }}_trigger" value="{{ t.key }}"> {{ t.label }}
          </label>
        </div>
      {% endfor %}
    </div>
  </div>
</form>
